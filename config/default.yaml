camera:
  type: webcam
  id: 4
  serial: null
  color_width: 1280
  color_height: 720
  fps: 30
  fourcc: MJPG
  buffer_size: 2
  autofocus: false
  focus: 0
  intrinsics_file: config/calibration/webcam/intrinsics_Nov08_Focus_0.npz
calibration:
  hand_eye_file: hand_eye_test_manually_focus0_nov08.npz
  aruco:
    marker_length_m: 0.1
    dict_id: 20
    target_marker_id: 0
  hand_eye_method: TSAI
  auto:
    translation_radius_m: 0.01
    rotation_deg: 15.0
    target_samples: 25
    max_attempts: 60
  hand_eye_compensation_m:
    x: 0.02
    y: 0.01
    z: 0
detection:
  conf_threshold: 0.5
  iou_threshold: 0.45
robot:
  repo_root: null
  gripper:
    ready_open_m: 0.055
    close_offset_m: 0.01
    fixed_close_m: 0.03
    dm:
      angle_open: 4.0
      counterclockwise: true
      tau_max: 1.5
      close_torque: 1.0
      default_force: 0.3
    rs:
      angle_open: 5.0
      counterclockwise: false
      tau_max: 1.5
      close_torque: 0.5
      default_force: 0.05
  ready_pose:
    x: 0.3
    y: 0
    z: 0.3
    roll: 0.0
    pitch: 0.7
    duration: 3.0
yolo:
  model_name: best_with_green_rack.pt
  device: '0'
  use_world: true
  custom_classes:
  - yellow screwdriver
  - blue cap with transparent centrifuge tube inside a container
  - blue cube
  - a thin transparent plastic ring on a dark surface
grasp_pipeline:
  infer_every_live: 1
  grasp:
    table_z_m: 0.17
    depth_quantile: 0.5
    pregrasp_offset_m: 0.15
    insertion_depth_m: 0
    grasp_z_offset_m: -0.02
    min_base_z_m: 0.0
graspnet:
  checkpoint: checkpoint-rs.tar
  num_point: 20000
  collision_thresh: 0.01
  min_depth: 0.05
  max_depth: 1.0
  top_k: 50
  target_class: null
  target_margin_px: 12
  target_expand_ratio: 1.35
